name: supermarket_app
description: "Kirana & Supermarket multi-role mobile app for local Indian store owners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Firebase Suite
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.0
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_crashlytics: ^4.0.1
  firebase_remote_config: ^5.0.0
  firebase_app_check: ^0.3.0+1

  # Local Persistence & Offline Caching
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Payments & Utilities
  razorpay_flutter: ^1.3.7
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  speech_to_text: ^6.6.1
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.1.2
  url_launcher: ^6.3.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/icons/
